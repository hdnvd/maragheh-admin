<div class="bg">
  <div class="panel">
    <div class="hero">
      <img class="dome" src="logo.png" alt="" />
      <h1>مراغه</h1>
      <p>اخبار، تصاویر، جاذبه‌های گردشگری، مشاهیر و آب و هوای مراغه</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="form">
      <h2>ورود به پنل مدیریت</h2>

      <mat-form-field appearance="outline">
        <mat-label>ایمیل</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="username" class="ltr" />
        <mat-icon matSuffix>mail</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>رمز عبور</mat-label>
        <input matInput [type]="hide() ? 'password' : 'text'" formControlName="password" autocomplete="current-password" class="ltr" />
        <button mat-icon-button matSuffix type="button" (click)="hide.set(!hide())" [attr.aria-label]="'نمایش رمز'">
          <mat-icon>{{ hide() ? 'visibility' : 'visibility_off' }}</mat-icon>
        </button>
      </mat-form-field>

      @if (error()) {
        <div class="error">{{ error() }}</div>
      }

      <button mat-flat-button type="submit" [disabled]="form.invalid || busy()">ورود</button>
      @if (busy()) {
        <mat-progress-bar mode="indeterminate" />
      }
    </form>
  </div>
</div>
